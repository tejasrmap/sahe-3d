<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="Dr Veeramallu Satya Sahithi">
  <title>SAHE Kanuru in 3D</title>
  <style>
    :root {
      --bg: #dfe9d6;
      --card: rgba(250, 252, 246, .94);
      --fg: #14301f;
      --mut: #5b6f61;
      --ac: #0f6b5c;
      --ln: rgba(20, 48, 31, .16);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1a14;
        --card: rgba(22, 34, 28, .94);
        --fg: #e6f0e4;
        --mut: #9db3a4;
        --ac: #4fc3a6;
        --ln: rgba(230, 240, 228, .18)
      }
    }

    :root[data-theme="dark"] {
      --bg: #0e1a14;
      --card: rgba(22, 34, 28, .94);
      --fg: #e6f0e4;
      --mut: #9db3a4;
      --ac: #4fc3a6;
      --ln: rgba(230, 240, 228, .18)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif
    }

    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .card {
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 14px;
      backdrop-filter: blur(6px)
    }

    #title {
      position: fixed;
      left: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      padding: 10px 14px
    }

    #title b {
      font-size: 19px;
      letter-spacing: .2px
    }

    #title i {
      font-style: normal;
      color: var(--ac);
      font-weight: 700
    }

    #title small {
      display: block;
      color: var(--mut);
      font-size: 12px;
      margin-top: 2px
    }

    #side {
      position: fixed;
      right: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      width: min(340px, calc(100vw - 24px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch
    }

    #q {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      font: inherit;
      font-size: 14px;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 12px
    }

    #q:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 2px
    }

    #res {
      max-height: 36vh;
      overflow: auto;
      display: none;
      padding: 4px
    }

    #res div {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px
    }

    #res div:hover {
      background: var(--ln)
    }

    #res span {
      color: var(--mut);
      font-size: 12px;
      margin-left: 6px
    }

    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end
    }

    button {
      font: inherit;
      font-size: 13px;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 20px;
      padding: 7px 12px;
      cursor: pointer
    }

    #chips button[aria-pressed=true] {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    #bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 8px
    }

    .pin {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12.5px;
      padding: 4px 10px 4px 8px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--ln);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
      will-change: transform
    }

    .pin:before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--d);
      margin-right: 6px
    }

    #info {
      position: fixed;
      left: 12px;
      bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      padding: 10px 14px;
      max-width: min(300px, calc(100vw - 24px));
      display: none;
      font-size: 13px
    }

    #info b {
      display: block;
      font-size: 15px;
      margin-bottom: 2px
    }

    #info span {
      color: var(--mut)
    }

    #bar {
      width: calc(100vw - 24px);
      flex-wrap: wrap;
      justify-content: center
    }

    #tp {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      width: min(420px, calc(100vw - 24px));
      padding: 14px 16px;
      box-sizing: border-box;
      max-height: 62vh;
      overflow: auto
    }

    #tp[hidden] {
      display: none
    }

    .rw {
      display: flex;
      justify-content: space-between;
      align-items: flex-start
    }

    #tt {
      font-size: 26px;
      font-weight: 700
    }

    #ts {
      color: var(--mut);
      font-size: 12px
    }

    .live {
      background: #d64545 !important;
      color: #fff !important;
      border-color: #d64545 !important;
      opacity: .5
    }

    .live.on {
      opacity: 1
    }

    #sl {
      width: 100%;
      margin: 12px 0 2px;
      height: 8px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 5px;
      background: linear-gradient(90deg, #0e1230 0%, #0e1230 21%, #e8a06a 27%, #8dc3ea 40%, #9fd0f2 58%, #f0a56a 72%, #14183a 79%, #0e1230 100%)
    }

    #sl::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--ac);
      cursor: pointer
    }

    #sl::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--ac)
    }

    .tk {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mut);
      margin-bottom: 10px
    }

    #tp h4 {
      margin: 12px 0 6px;
      font-size: 12px;
      color: var(--mut);
      font-weight: 600
    }

    .g {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    #tp button[aria-pressed=true],
    #bar button[aria-pressed=true] {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .tgl {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      font-size: 13px
    }

    #cap {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      padding: 12px 26px;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
      display: none;
      white-space: nowrap
    }

    body.tour #cap {
      display: block
    }

    body.tour #title,
    body.tour #side,
    body.tour #bar,
    body.tour #info,
    body.tour #tp,
    body.tour .pin {
      display: none !important
    }
  </style>
</head>
